---

- name: Testing destination-nat
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.nat_destination:
      match_fields: ['description']

    oxlorg.opnsense.list:
      target: 'nat_destination'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of invalid alias (server-side)
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'wan'
        destination: 'DoesNotExist'
        target: '192.168.0.2'
      register: opn_fail2
      failed_when: not opn_fail2.failed
      when: not ansible_check_mode

    - name: Adding 1
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'wan'
        destination: 'wanip'
        destination_port: 8080
        protocol: 'TCP'
        target: '192.168.0.2'
        target_port: 80
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Changing 1
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'wan'
        destination: 'wanip'
        destination_port: 8443
        protocol: 'TCP'
        target: '192.168.0.5'
        target_port: 443
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed

    - name: Disabling 1
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'wan'
        destination: 'wanip'
        destination_port: 8443
        protocol: 'TCP'
        target: '192.168.0.5'
        target_port: 443
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'wan'
        destination: 'wanip'
        destination_port: 8443
        protocol: 'TCP'
        target: '192.168.0.5'
        target_port: 443
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'wan'
        destination: 'wanip'
        destination_port: 8443
        protocol: 'TCP'
        target: '192.168.0.5'
        target_port: 443
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Removing 1
      oxlorg.opnsense.nat_destination:
        description: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode
